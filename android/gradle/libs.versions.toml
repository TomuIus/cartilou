[versions]
agp = "9.5.3"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Lifecycle (ViewModels…) : 2.11.1, même version que Canapilou ; elle contient
# aussi le module ViewModel de Navigation 3.
lifecycleRuntimeKtx = "2.11.1"
activityCompose = "1.13.0"
# Kotlin : 2.4.21 au lieu de 2.2.10 (version par défaut du plugin Android),
# comme Canapilou : supabase-kt 3.9.0, qu'on ajoutera pour le compte, est
# construite en Kotlin 2.4, et on garde ainsi l'ensemble de versions qui
# fonctionne déjà dans Canapilou. À garder IDENTIQUE à la version du
# « classpath » dans le build.gradle.kts principal.
kotlin = "2.4.21"
composeBom = "2026.02.01"
# Navigation 3 : passage d'un écran à l'autre (même version que Canapilou).
nav3 = "1.2.2"
# Ktor : la bibliothèque réseau, pour TCGdex maintenant et pour Supabase plus
# tard (même version que Canapilou).
ktor = "3.6.0"
# Coil : affichage des images (cartes, logos), téléchargées par Ktor (même
# version que Canapilou, qui la branche sur OkHttp).
coil = "3.6.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# ViewModels dans Compose, lecture de leur état, et un ViewModel par écran
# avec Navigation 3.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleRuntimeKtx" }
# Navigation 3.
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }
# Ktor : moteur réseau Android (celui du guide officiel de Supabase), et
# transformation automatique des réponses JSON en objets Kotlin.
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Coil 3 : affichage d'images dans Compose, et téléchargement par Ktor 3.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Sérialisation : transforme les réponses de TCGdex (JSON) en objets Kotlin, et
# permet d'enregistrer l'historique des écrans de Navigation 3.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
